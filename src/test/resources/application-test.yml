# Тестовый профиль. Встроенная H2 в режиме совместимости с PostgreSQL,
# схема пересоздаётся для каждого запуска контекста.
spring:
  datasource:
    url: jdbc:h2:mem:learning_platform_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  demo-data:
    enabled: false

logging:
  level:
    com.learning.platform: INFO
